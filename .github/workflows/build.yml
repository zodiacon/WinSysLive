# Builds the solution (Debug and Release x64) and runs the tests (Tests\Tests.vcxproj).
# The image has Visual Studio 2026, whose only C++ toolset is v145, the projects' (actions/runner-images #14016, #14101).
# ReleaseSigned isn't built: it signs with a certificate the runner doesn't have.
name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - name: Check out (with the WinSys and WTLHelper submodules)
        uses: actions/checkout@v7
        with:
          # not recursive: WinSys lists a WTLHelper submodule of its own that nothing builds
          submodules: true

      # vcpkg's binary cache (VCPKG_DEFAULT_BINARY_CACHE: the built packages, which actions/cache keeps between runs;
      # vcpkg's own GitHub cache provider is gone). Its key: the image's vcpkg (its commit decides the ports' versions and
      # so the packages' hashes) and the packages; a new image misses, restores the last cache (vcpkg skips what no longer
      # matches) and saves a new one
      - name: Find the vcpkg version
        id: vcpkg
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore the vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ steps.vcpkg.outputs.commit }}-phnt-wil-detours-wtl-nlohmann
          restore-keys: vcpkg-

      # vcpkg with user-wide integration, as the projects expect: phnt (WinSys and the app), WIL, Detours (WTLHelper's
      # dark mode), WTL and nlohmann-json (WinSys's HCS answers); both triplets, as WTLHelper and HexControl use the
      # static one (VcpkgUseStatic), the rest the default one. From the binary cache when it has them
      - name: Install the vcpkg packages (phnt, WIL, Detours, WTL, nlohmann-json)
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          $packages = 'phnt', 'wil', 'detours', 'wtl', 'nlohmann-json'
          & $vcpkg install ($packages | ForEach-Object { "${_}:x64-windows"; "${_}:x64-windows-static" })
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $vcpkg integrate install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: pwsh
        run: msbuild WinSysLive.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m /v:m /nologo

      # the gate: everything but the tests reading the live system
      - name: Tests
        shell: pwsh
        run: |
          & ".\x64\${{ matrix.configuration }}\Tests.exe" -Live
          exit $LASTEXITCODE

      # the live system's (power requests, devices, event logs): the runner's machine, so informational
      - name: Live tests (informational)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          & ".\x64\${{ matrix.configuration }}\Tests.exe" Live
          exit $LASTEXITCODE

      - name: Upload the build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: WinSysLive-x64-Release
          path: |
            x64/Release/WinSysLive.exe
            x64/Release/Tests.exe
          if-no-files-found: warn
